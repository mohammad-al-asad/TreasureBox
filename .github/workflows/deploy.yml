name: Deploy

# GitHub only tells the server which commit to deploy. The server pulls the code,
# builds the Docker images itself and restarts the stack (deploy/remote-deploy.sh).
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "dashboard/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  INSTANCE_ID: i-0536c68bb3c67e752

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy on server
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters "{\"executionTimeout\":[\"2400\"],\"commands\":[\"cd /opt/treasurebox/src && git fetch --quiet origin && git checkout --quiet --force $GITHUB_SHA && bash deploy/remote-deploy.sh $GITHUB_SHA\"]}" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID (server builds the images, this takes several minutes)"
          STATUS=Pending
          for i in $(seq 1 480); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "Status: $STATUS"
          test "$STATUS" = "Success"
