# Single server on the Elastic IP. When a domain is added, set server_name and add TLS (certbot).
upstream api { server api:5000; }
upstream dashboard { server dashboard:3000; }

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 55m;
  proxy_read_timeout 120s;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # API, uploaded files and health check
  location ~ ^/(api|uploads)/ { proxy_pass http://api; }
  location = /health { proxy_pass http://api; }

  # Socket.IO (WebSocket upgrade)
  location /socket.io/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  # Everything else: the admin dashboard
  location / {
    proxy_pass http://dashboard;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
