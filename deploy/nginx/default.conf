# Always loaded. Plain HTTP on the Elastic IP (and any host without TLS).
# HTTPS for api./admin.treassurebox.com lives in tls.conf, which the container
# enables at startup only when the Let's Encrypt certificate exists (40-enable-tls.sh).

upstream api { server api:5000; }
upstream dashboard { server dashboard:3000; }

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Landing page, privacy policy and account deletion page (static files in deploy/site)
server {
  listen 80;
  server_name treassurebox.com www.treassurebox.com;

  location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

  location / {
    # Once the certificate exists, send everyone to HTTPS (tls.conf serves the site there)
    if (-f /etc/letsencrypt/live/treassurebox/fullchain.pem) {
      return 301 https://treassurebox.com$request_uri;
    }
    include /etc/nginx/snippets/site.conf;
  }
}

server {
  listen 80 default_server;
  server_name _;
  include /etc/nginx/snippets/common.conf;

  # Let's Encrypt domain validation
  location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

  # API, uploaded files, health check
  location ~ ^/(api|uploads)/ { proxy_pass http://api; }
  location = /health { proxy_pass http://api; }
  include /etc/nginx/snippets/socketio.conf;

  # Everything else: the admin dashboard
  include /etc/nginx/snippets/dashboard.conf;
}
