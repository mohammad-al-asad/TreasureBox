# HTTPS for the domain. Copied into conf.d by 40-enable-tls.sh when the certificate exists.
# Certificate: /etc/letsencrypt/live/treassurebox (issued by deploy/setup-tls.sh).

# HTTP on the domain names: allow certificate renewal, redirect everything else to HTTPS
server {
  listen 80;
  server_name api.treassurebox.com admin.treassurebox.com;
  location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

# API (also used by the phone app)
server {
  listen 443 ssl;
  http2 on;
  server_name api.treassurebox.com;
  include /etc/nginx/snippets/ssl.conf;
  include /etc/nginx/snippets/common.conf;

  include /etc/nginx/snippets/socketio.conf;
  location / { proxy_pass http://api; }
}

# Landing page, privacy policy and account deletion page
server {
  listen 443 ssl;
  http2 on;
  server_name treassurebox.com;
  include /etc/nginx/snippets/ssl.conf;

  location / { include /etc/nginx/snippets/site.conf; }
}

# www -> apex
server {
  listen 443 ssl;
  http2 on;
  server_name www.treassurebox.com;
  include /etc/nginx/snippets/ssl.conf;
  return 301 https://treassurebox.com$request_uri;
}

# Admin dashboard
server {
  listen 443 ssl;
  http2 on;
  server_name admin.treassurebox.com;
  include /etc/nginx/snippets/ssl.conf;
  include /etc/nginx/snippets/common.conf;

  include /etc/nginx/snippets/dashboard.conf;
}
