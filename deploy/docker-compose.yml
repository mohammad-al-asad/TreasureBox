# Production stack. The server builds the images itself from the repo checkout in
# /opt/treasurebox/src (see deploy/remote-deploy.sh).
name: treasurebox

services:
  api:
    build: ../api
    image: treasurebox-api:latest
    restart: unless-stopped
    env_file: /opt/treasurebox/api.env
    environment:
      NODE_ENV: production
      PORT: "5000"
    volumes:
      - uploads:/app/uploads
    mem_limit: 450m
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  dashboard:
    build:
      context: ../dashboard
      # NEXT_PUBLIC_* values are baked into the browser bundle at build time.
      # They come from /opt/treasurebox/src/deploy/.env, written by remote-deploy.sh.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    image: treasurebox-dashboard:latest
    restart: unless-stopped
    mem_limit: 300m
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/tls.conf:/etc/nginx/tls/tls.conf:ro
      - ./nginx/40-enable-tls.sh:/docker-entrypoint.d/40-enable-tls.sh:ro
      # Landing page + privacy policy (treassurebox.com)
      - ./site:/usr/share/nginx/site:ro
      # Let's Encrypt certificates and HTTP-01 challenge files (deploy/setup-tls.sh)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on: [api, dashboard]
    logging: *logging

volumes:
  uploads:
